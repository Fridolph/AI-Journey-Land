services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-journey-pg
    restart: unless-stopped
    ports:
      - '15432:5432'
    environment:
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey123
      POSTGRES_DB: ai_journey_lab
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-journey-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:2.50
    container_name: ai-journey-redisinsight
    restart: unless-stopped
    ports:
      - '5540:5540'
    volumes:
      - ridata:/data
    environment:
      - RI_HOST=0.0.0.0
    depends_on:
      - redis

volumes:
  pgdata:
  redisdata:
  ridata:
